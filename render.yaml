services:
  # SOLO el controlador difuso (sin bot)
  - type: web
    name: esp32-fuzzy-controller
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python fuzzy_controller_completo.py
    envVars:
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        value: 8883
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false